version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - redis
    restart: unless-stopped

  onboarding-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "workers.onboarding_worker"]
    env_file:
      - ../.env
    depends_on:
      - api
    restart: unless-stopped

  retry-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "workers.retry_worker"]
    env_file:
      - ../.env
    restart: unless-stopped

  dead-letter-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "workers.dead_letter_worker"]
    env_file:
      - ../.env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
